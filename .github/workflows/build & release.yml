name: Compile Debug and Release OpenLRR

on:
  push:
    paths: src/**
    tags: v*

jobs:
  Nightly_release_build:
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1
      - name: Build OpenLRR for x86 Release
        run: msbuild openlrr.sln /p:Configuration=Release /p:Platform=x86
      - name: Rerrange files to easily use OpenLRR
        run: |
          mkdir OpenLRR/
          Move-Item bin/openlrr.dll OpenLRR/
          Move-Item OpenLRR.exe OpenLRR/
          Move-Item data/* OpenLRR/
      - name: Upload OpenLRR Release build
        uses: actions/upload-artifact@v3
        with:
          name: OpenLRR-Release
          path: |
            OpenLRR/

  Nightly_debug_build:
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1
      - name: Build OpenLRR for x86 Debug
        run: msbuild openlrr.sln /p:Configuration=Debug /p:Platform=x86
      - name: Rerrange files to easily use OpenLRR
        run: |
          mkdir OpenLRR/
          Move-Item bin/openlrr-d.dll OpenLRR/
          Move-Item OpenLRR.exe OpenLRR/
          Move-Item data/* OpenLRR/
      - name: Upload OpenLRR Debug build
        uses: actions/upload-artifact@v3
        with:
          name: OpenLRR-Debug
          path: |
            OpenLRR/
  
  prepare_release:
    runs-on: "ubuntu-latest" # Zip action only works on Ubuntu
    needs: Nightly_release_build
    # Instead of creating a new workflow file, we trigger this job only if there's a new tag
    if: startsWith(github.ref, 'refs/tags/') 
    steps:
      - name: Set tag in env # Extract the pusht tag into a variable for later use
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Get artifact # It's faster to download the artifact then to recompile
        uses: actions/download-artifact@v2
        with:
          name: OpenLRR-Release
      - name: debug again
        run: |
          pwd
          ls -al
          cd ../
          ls -al
      - name: Zip artifact
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r OpenLRR-${{ env.RELEASE_VERSION }}.zip ../OpenLRR/
      - name: Draft Public Release
        uses: "softprops/action-gh-release@v1"
        with:
          name: "Draft Release ${{ env.RELEASE_VERSION }}"
          draft: true
          files: OpenLRR-${{ env.RELEASE_VERSION }}.zip
