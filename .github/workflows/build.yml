name: Compile Debug openlrr

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    name: run on windows
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1
      - name: Build app for Debug
        run: msbuild openlrr.sln /p:Configuration=Release /p:Platform=x86
