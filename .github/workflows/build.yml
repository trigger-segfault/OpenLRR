name: Compile Spark

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    name: run on windows
    runs-on: windows-latest
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1
      - name: Build app for release
        run: msbuild openlrr.sln /t:build /p:Configuration=Debug;Platform=x86
