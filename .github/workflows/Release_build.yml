name: Compile Debug openlrr

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    name: Run on windows
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1
      - name: Build app for x86 Release and Debug
        run: msbuild openlrr.sln /p:Configuration:Debug /p:Platform=x86
      - name: Upload Release build
        uses: actions/upload-artifact@v3
        with:
          name: openlrr
          path: ./bin/openlrr.dll
      - name: Upload Debug build
        uses: actions/upload-artifact@v3
        with:
          name: openlrr-d
          path: ./bin/openlrr-d.dll
