name: Compile Debug and Release openlrr

on:
  push:
    paths: src/**
    tags: v*

jobs:
  nightly_release_build:
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1
      - name: Build OpenLRR for x86 Release
        run: msbuild openlrr.sln /p:Configuration=Release /p:Platform=x86
      - name: Upload OpenLRR Release build
        uses: actions/upload-artifact@v3
        with:
          name: OpenLRR-Release
          path: |
            ./bin/openlrr.dll
            ./OpenLRR.exe
            ./data/Data/**
            ./data/Settings/**

  nightly_debug_build:
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1
      - name: Build OpenLRR for x86 Debug
        run: msbuild openlrr.sln /p:Configuration=Debug /p:Platform=x86
      - name: Upload OpenLRR Debug build
        uses: actions/upload-artifact@v3
        with:
          name: OpenLRR-Debug
          path: |
            ./bin/openlrr-d.dll
            ./OpenLRR-d.exe
            ./data/Data/**
            ./data/Settings/**
  
  prepare_release:
    runs-on: "ubuntu-latest"
    needs: nightly_release_build
    # Instead of creating a new workflow file, instead we use trigger this job only if there's a new tag, we'll download the release artefact to save time aswell
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/') 
    steps:
      - name: Get artifact
        uses: actions/download-artifact@v2
        with:
          name: OpenLRR-Release
      - name: Zip artifact
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r OpenLRR-Release.zip OpenLRR.exe bin/ data/
      - name: Release public builds
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          title: "Release ${{ github.event.release.tag_name }}"
          draft: true
          files: OpenLRR-Release.zip
