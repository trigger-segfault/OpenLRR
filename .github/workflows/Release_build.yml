name: Compile Debug openlrr

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    name: run on windows
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1
      - name: Build app for Release
        run: msbuild openlrr.sln /p:Configuration=Release /p:Platform=x86
      - name: test whats in here
        shell: pwsh
        run: dir; cd bin/; dir
      - name: Upload build
        uses: actions/upload-artifact@v3
        with:
          name: openlrr
          path: ./bin/openlrr.dll
